<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "en-us" }}">

  <head>
    {{ partial "head-html.html" . -}}

    <meta name="robots" content="noindex, nofollow" />
  </head>

  <body class="readingpage">
    <div class="hold-all-readingpage">
      <div id="skipnav"><a href="#main-content">Skip navigation</a></div>
      <header class="page-header">
        <div class="top-hold">
          {{ with resources.Get "images/OpenSquareLogo.png" -}}
          <div class="osq-logo site-title"><a href="{{ site.Home.Permalink }}"><img src="{{ .RelPermalink }}" alt="{{ site.Title }}:{{ site.Params.tagline}}"></a></div>{{ end }}
            <div class="osq-logo"><h1><a href="{{ site.Home.Permalink }}">Open <span>Square</span></a></h1></div>
          <div class="nyup-logo">
          {{ with resources.Get "images/NYUPress_short_color.svg" }}<a href="https://nyupress.org" target="_blank"><img class="img-fluid" src="{{ .RelPermalink }}" alt="NYU Press"></a>{{ end }}
        </div>

        </div>
      </header>
