{{- $stringisbn := .isbn  -}}
{{- $imagepath := urls.JoinPath .context.Site.Params.image_server (add $stringisbn ".jpg") -}}
<div class="thumb" role="presentation" aria-hidden="true" >
 <picture>
  <source media="(min-width: 300px)"
    srcset="{{- $imagepath -}}?auto=format&amp;w=150&amp;dpr=1&amp;q=20 1x, {{- $imagepath -}}?auto=format&amp;w=150&amp;dpr=2&amp;q=20 2x, {{- $imagepath -}}?auto=format&amp;w=150&amp;dpr=3&amp;q=20 3x, ">
  <img src="{{- $imagepath -}}?auto=format&amp;w=150" alt="" class="img-fluid">
</picture>
</div>
